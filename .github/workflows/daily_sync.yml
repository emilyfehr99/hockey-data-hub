name: Daily Live Season Sync

on:
  schedule:
    # Runs at 08:00 UTC (03:00 EST / 00:00 PST) every day
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  sync_live:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync Player Crosswalk & Active Rosters
        run: |
          python3 pipelines/entity_resolution.py

      - name: Enrich Active Player Metadata & Stats
        run: |
          python3 pipelines/enrich_player_metadata.py --active-only

      - name: Sync Concluded Game Boxscores
        run: |
          python3 pipelines/extract_nhl.py --season current

      - name: Sync High-Frequency Goal Tracking Sprites
        run: |
          python3 pipelines/extract_goal_sprites.py --season current --recent-games 15

      - name: Sync Current Season Possession & Combinations
        env:
          ADVANCED_METRICS_BASE_URL: ${{ secrets.ADVANCED_METRICS_BASE_URL }}
          DATA_FEED_KEY: ${{ secrets.DATA_FEED_KEY }}
        run: |
          python3 pipelines/extract_possession.py --season current

      - name: Commit and Push Daily Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/parquet/
          if git diff --staged --quiet; then
            echo "No new updates."
          else
            git commit -m "chore(data): daily live sync $(date +'%Y-%m-%d')"
            git push
          fi
